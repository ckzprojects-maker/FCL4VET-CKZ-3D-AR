<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FCL4VET - 3D Printing + AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 9px 14px; border-radius: 12px;
      background: rgba(0,0,0,.72); color: white; font-size: 14px;
      text-align: center; pointer-events: none;
    }
  </style>
</head>

<body>
<div id="hint">FCL4VET • Point the camera at the AR marker</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <a-assets>
    <a-asset-item id="ckz-model" src="assets/asset.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="assets/marker.patt">

    <!-- Presentation plane facing the camera when the marker lies flat -->
    <a-entity rotation="-90 0 0">

      <!-- Central 3D model.
           Rotated independently to show the opposite/main face. -->
      <a-entity
        gltf-model="#ckz-model"
        position="0 0 0.16"
        rotation="0 180 0"
        scale="0.82 0.82 0.82">
      </a-entity>

      <!-- HEADER -->
      <a-plane
        position="0 1.18 0.03"
        width="2.65" height="0.36"
        material="shader:flat; color:#202020; opacity:0.94; transparent:true">
      </a-plane>
      <a-text
        value="FCL4VET - 3D PRINTING + AR"
        position="0 1.18 0.055"
        align="center"
        baseline="center"
        color="#FFFFFF"
        width="3.0"
        wrap-count="30">
      </a-text>

      <!-- CARD 1 -->
      <a-plane
        position="-1.02 0.62 0.03"
        width="1.25" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true">
      </a-plane>
      <a-text
        value="1. 3D MODEL&#10;Digital model"
        position="-1.02 0.62 0.06"
        align="center"
        baseline="center"
        color="#111111"
        width="1.55"
        wrap-count="18">
      </a-text>

      <!-- CARD 2 -->
      <a-plane
        position="1.02 0.62 0.03"
        width="1.25" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true">
      </a-plane>
      <a-text
        value="2. BAMBU STUDIO&#10;Print preparation"
        position="1.02 0.62 0.06"
        align="center"
        baseline="center"
        color="#111111"
        width="1.55"
        wrap-count="18">
      </a-text>

      <!-- CARD 3 -->
      <a-plane
        position="-1.02 -0.62 0.03"
        width="1.25" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true">
      </a-plane>
      <a-text
        value="3. 3D PRINTING&#10;Bambu Lab P2S"
        position="-1.02 -0.62 0.06"
        align="center"
        baseline="center"
        color="#111111"
        width="1.55"
        wrap-count="18">
      </a-text>

      <!-- CARD 4 -->
      <a-plane
        position="1.02 -0.62 0.03"
        width="1.25" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true">
      </a-plane>
      <a-text
        value="4. AUGMENTED REALITY&#10;Interactive information"
        position="1.02 -0.62 0.06"
        align="center"
        baseline="center"
        color="#111111"
        width="1.48"
        wrap-count="20">
      </a-text>

      <!-- FOOTER -->
      <a-plane
        position="0 -1.18 0.03"
        width="2.65" height="0.36"
        material="shader:flat; color:#202020; opacity:0.94; transparent:true">
      </a-plane>
      <a-text
        value="3D MODEL  >  BAMBU STUDIO  >  3D PRINTING  >  AR"
        position="0 -1.18 0.055"
        align="center"
        baseline="center"
        color="#FFFFFF"
        width="2.75"
        wrap-count="45">
      </a-text>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
