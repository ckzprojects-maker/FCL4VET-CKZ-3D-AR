<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FCL4VET - 3D Printing + AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #hint {
      position:fixed; top:10px; left:50%; transform:translateX(-50%);
      z-index:10; padding:8px 14px; border-radius:12px;
      background:rgba(0,0,0,.72); color:white; font:14px Arial,sans-serif;
      pointer-events:none;
    }
  </style>
  <script>
    AFRAME.registerComponent('marker-hint', {
      init: function () {
        const hint = document.getElementById('hint');
        this.el.addEventListener('markerFound', () => hint.style.display = 'none');
        this.el.addEventListener('markerLost',  () => hint.style.display = 'block');
      }
    });
  </script>
</head>
<body>
<div id="hint">FCL4VET • Point the camera at the AR marker</div>

<a-scene embedded vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <a-assets>
    <a-asset-item id="ckz-model" src="assets/asset.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="assets/marker.patt" marker-hint>

    <!-- The whole educational board faces the camera -->
    <a-entity rotation="-90 0 0">

      <!-- Correct side of the keychain: red C + blue KZ -->
      <a-entity gltf-model="#ckz-model"
        position="0 0 0.13"
        rotation="0 0 0"
        scale="0.82 0.82 0.82">
      </a-entity>

      <!-- Header -->
      <a-plane position="0 1.18 0.02" width="2.65" height="0.38"
        material="shader:flat; color:#202020; opacity:0.94; transparent:true"></a-plane>
      <a-text value="FCL4VET - 3D PRINTING + AR"
        position="0 1.18 0.09" align="center" baseline="center"
        color="#FFFFFF" width="2.75"></a-text>

      <!-- Card 1 -->
      <a-plane position="-1.02 0.62 0.02" width="1.28" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true"></a-plane>
      <a-text value="1. 3D MODEL"
        position="-1.02 0.70 0.10" align="center" baseline="center"
        color="#111111" width="1.65"></a-text>
      <a-text value="Digital model"
        position="-1.02 0.54 0.10" align="center" baseline="center"
        color="#333333" width="1.40"></a-text>

      <!-- Card 2 -->
      <a-plane position="1.02 0.62 0.02" width="1.28" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true"></a-plane>
      <a-text value="2. BAMBU STUDIO"
        position="1.02 0.70 0.10" align="center" baseline="center"
        color="#111111" width="1.55"></a-text>
      <a-text value="Print preparation"
        position="1.02 0.54 0.10" align="center" baseline="center"
        color="#333333" width="1.35"></a-text>

      <!-- Card 3 -->
      <a-plane position="-1.02 -0.62 0.02" width="1.28" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true"></a-plane>
      <a-text value="3. 3D PRINTING"
        position="-1.02 -0.54 0.10" align="center" baseline="center"
        color="#111111" width="1.55"></a-text>
      <a-text value="Bambu Lab P2S"
        position="-1.02 -0.70 0.10" align="center" baseline="center"
        color="#333333" width="1.35"></a-text>

      <!-- Card 4 -->
      <a-plane position="1.02 -0.62 0.02" width="1.28" height="0.50"
        material="shader:flat; color:#FFFFFF; opacity:0.96; transparent:true"></a-plane>
      <a-text value="4. AUGMENTED REALITY"
        position="1.02 -0.54 0.10" align="center" baseline="center"
        color="#111111" width="1.38"></a-text>
      <a-text value="Interactive information"
        position="1.02 -0.70 0.10" align="center" baseline="center"
        color="#333333" width="1.25"></a-text>

      <!-- Footer -->
      <a-plane position="0 -1.18 0.02" width="2.65" height="0.36"
        material="shader:flat; color:#202020; opacity:0.94; transparent:true"></a-plane>
      <a-text value="3D MODEL  >  BAMBU STUDIO  >  3D PRINTING  >  AR"
        position="0 -1.18 0.09" align="center" baseline="center"
        color="#FFFFFF" width="2.65"></a-text>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
