<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
    #hint {
      position:fixed; top:12px; left:50%; transform:translateX(-50%);
      z-index:10; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.72); color:#fff; font-size:14px;
      text-align:center; pointer-events:none;
    }
  </style>
</head>
<body>
<div id="hint">FCL4VET • skieruj kamerę na marker AR</div>

<a-scene embedded vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

  <a-assets>
    <a-asset-item id="ckz-model" src="assets/asset.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="assets/marker.patt">

    <!-- Cała prezentacja jest obrócona tak, aby leżała czytelnie NAD markerem -->
    <a-entity rotation="-90 0 0">

      <!-- MODEL CENTRALNY: dodatkowy obrót modelu koryguje jego własną orientację -->
      <a-entity gltf-model="#ckz-model"
        position="0 0 0.10"
        rotation="0 0 0"
        scale="0.72 0.72 0.72">
      </a-entity>

      <!-- NAGŁÓWEK -->
      <a-plane position="0 1.18 0.03" width="2.55" height="0.34"
        material="color:#202020; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="FCL4VET - DRUK 3D + AR"
        position="0 1.18 0.05" align="center"
        color="#FFFFFF" width="2.25">
      </a-text>

      <!-- LEWA GÓRA -->
      <a-plane position="-1.02 0.65 0.03" width="1.20" height="0.48"
        material="color:#FFFFFF; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="1. MODEL 3D\nCyfrowy model elementu"
        position="-1.02 0.65 0.05" align="center"
        color="#111111" width="1.05">
      </a-text>

      <!-- PRAWA GÓRA -->
      <a-plane position="1.02 0.65 0.03" width="1.20" height="0.48"
        material="color:#FFFFFF; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="2. BAMBU STUDIO\nPrzygotowanie do druku"
        position="1.02 0.65 0.05" align="center"
        color="#111111" width="1.05">
      </a-text>

      <!-- LEWA DÓŁ -->
      <a-plane position="-1.02 -0.65 0.03" width="1.20" height="0.48"
        material="color:#FFFFFF; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="3. DRUK 3D\nBambu Lab P2S"
        position="-1.02 -0.65 0.05" align="center"
        color="#111111" width="1.05">
      </a-text>

      <!-- PRAWA DÓŁ -->
      <a-plane position="1.02 -0.65 0.03" width="1.20" height="0.48"
        material="color:#FFFFFF; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="4. AR\nInteraktywna informacja"
        position="1.02 -0.65 0.05" align="center"
        color="#111111" width="1.05">
      </a-text>

      <!-- STOPKA -->
      <a-plane position="0 -1.18 0.03" width="2.55" height="0.34"
        material="color:#202020; opacity:0.94; transparent:true">
      </a-plane>
      <a-text value="MODEL -> BAMBU STUDIO -> DRUK 3D -> AR"
        position="0 -1.18 0.05" align="center"
        color="#FFFFFF" width="2.15">
      </a-text>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
