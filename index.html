<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FCL4VET - 3D Printing + AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;overflow:hidden;font-family:Arial,sans-serif}
#guide{position:fixed;z-index:20;left:50%;top:12px;transform:translateX(-50%);
background:rgba(25,30,38,.90);color:#fff;padding:10px 18px;border-radius:15px;
font-weight:700;font-size:14px;box-shadow:0 3px 12px #0006}
</style>
<script>
AFRAME.registerComponent('marker-ui',{
 init:function(){
  const g=document.getElementById('guide');
  this.el.addEventListener('markerFound',()=>g.style.display='none');
  this.el.addEventListener('markerLost',()=>g.style.display='block');
 }
});

AFRAME.registerComponent('stabilize-logo', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj) return;
      obj.traverse((node) => {
        if (!node.isMesh) return;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((mat) => {
          if (!mat) return;
          const name = (mat.name || '').toLowerCase();
          if (name.includes('red')) {
            mat.depthTest = false;
            mat.depthWrite = false;
            mat.transparent = false;
            mat.side = THREE.DoubleSide;
            mat.needsUpdate = true;
            node.renderOrder = 50;
          }
        });
      });
    });
  }
});

</script>
</head>
<body>
<div id="guide">▣ &nbsp; Point the camera at the AR marker</div>

<a-scene embedded vr-mode-ui="enabled:false"
 renderer="logarithmicDepthBuffer:false;precision:high;antialias:true;alpha:true"
 arjs="trackingMethod:best;sourceType:webcam;debugUIEnabled:false">

<a-assets>
<a-asset-item id="model" src="assets/asset_fixed.glb"></a-asset-item>
</a-assets>

<a-marker type="pattern" url="assets/marker.patt" marker-ui>
<a-entity rotation="-90 0 0">

<!-- MODEL -->
<a-entity gltf-model="#model" stabilize-logo position="0 0 .18" scale=".72 .72 .72"></a-entity>

<!-- HEADER -->
<a-plane position="0 1.30 .02" width="2.82" height=".42"
 material="shader:flat;color:#202630;opacity:.94;transparent:true"></a-plane>
<a-text value="FCL4VET - 3D PRINTING + AR" position="0 1.35 .10"
 align="center" color="#FFFFFF" width="2.9"></a-text>
<a-text value="DEVELOP" position="0 1.20 .10"
 align="center" color="#FFFFFF" width="2.25"></a-text>

<!-- DIGITAL MODEL -->
<a-plane position="-1.20 .66 -.08" width="1.28" height=".62"
 material="shader:flat;color:#F4F7FA;opacity:1;transparent:false;side:double;depthWrite:true;depthTest:true"></a-plane>
<a-text value="DIGITAL MODEL" position="-1.20 .84 .22" align="center"
 color="#16202A" width="2.02"></a-text>
<a-text value="From idea to 3D model" position="-1.20 .69 .22" align="center"
 color="#58B2FF" width="1.75"></a-text>
<a-text value="Create the model and prepare it\nfor printing in Bambu Studio."
 position="-1.20 .47 .22" align="center" color="#202020" width="1.30"></a-text>

<!-- 3D PRINTING -->
<a-plane position="1.20 .66 -.08" width="1.28" height=".62"
 material="shader:flat;color:#F4F7FA;opacity:1;transparent:false;side:double;depthWrite:true;depthTest:true"></a-plane>
<a-text value="3D PRINTING" position="1.20 .84 .22" align="center"
 color="#16202A" width="2.02"></a-text>
<a-text value="Bambu Lab P2S" position="1.20 .69 .22" align="center"
 color="#58B2FF" width="1.75"></a-text>
<a-text value="FDM / FFF printing with PLA\ncreates a physical learning object."
 position="1.20 .47 .22" align="center" color="#202020" width="1.30"></a-text>

<!-- AUGMENTED REALITY -->
<a-plane position="-1.20 -.66 -.08" width="1.28" height=".62"
 material="shader:flat;color:#F4F7FA;opacity:1;transparent:false;side:double;depthWrite:true;depthTest:true"></a-plane>
<a-text value="AUGMENTED REALITY" position="-1.20 -.48 .22" align="center"
 color="#16202A" width="1.82"></a-text>
<a-text value="Bringing objects to life" position="-1.20 -.63 .22" align="center"
 color="#58B2FF" width="1.72"></a-text>
<a-text value="Scan the marker to explore the\n3D object and digital information."
 position="-1.20 -.75 .22" align="center" color="#202020" width="1.18"></a-text>

<!-- PRACTICAL APPLICATIONS -->
<a-plane position="1.20 -.66 -.08" width="1.28" height=".62"
 material="shader:flat;color:#F4F7FA;opacity:1;transparent:false;side:double;depthWrite:true;depthTest:true"></a-plane>
<a-text value="PRACTICAL APPLICATIONS" position="1.20 -.48 .22" align="center"
 color="#16202A" width="1.68"></a-text>
<a-text value="Learn - Use - Develop" position="1.20 -.63 .22" align="center"
 color="#58B2FF" width="1.72"></a-text>
<a-text value="3D printing + AR for VET,\nprototyping and technical learning."
 position="1.20 -.75 .22" align="center" color="#202020" width="1.18"></a-text>

<!-- CONNECTORS -->
<a-plane position="-.67 .31 -.03" width=".40" height=".018" rotation="0 0 -31"
 material="shader:flat;color:#1684E8;side:double"></a-plane>
<a-circle position="-.50 .20 -.01" radius=".030" material="shader:flat;color:#1684E8;side:double"></a-circle>

<a-plane position=".67 .31 -.03" width=".40" height=".018" rotation="0 0 31"
 material="shader:flat;color:#EF4444;side:double"></a-plane>
<a-circle position=".50 .20 -.01" radius=".030" material="shader:flat;color:#EF4444;side:double"></a-circle>

<a-plane position="-.67 -.31 -.03" width=".40" height=".018" rotation="0 0 31"
 material="shader:flat;color:#22A965;side:double"></a-plane>
<a-circle position="-.50 -.20 -.01" radius=".030" material="shader:flat;color:#22A965;side:double"></a-circle>

<a-plane position=".67 -.31 -.03" width=".40" height=".018" rotation="0 0 -31"
 material="shader:flat;color:#F0A51A;side:double"></a-plane>
<a-circle position=".50 -.20 -.01" radius=".030" material="shader:flat;color:#F0A51A;side:double"></a-circle>

<!-- FOOTER -->
<a-plane position="0 -1.27 .02" width="3.35" height=".32"
 material="shader:flat;color:#202630;opacity:.94;transparent:true"></a-plane>
<a-text value="3D MODEL  >  BAMBU STUDIO  >  3D PRINTING  >  AR"
 position="0 -1.27 .11" align="center" color="#FFFFFF" width="2.45" wrap-count="60"></a-text>

</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
</body>
</html>
