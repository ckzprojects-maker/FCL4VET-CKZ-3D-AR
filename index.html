<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FCL4VET – 3D Printing + AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; font-family:Arial,Helvetica,sans-serif; }
    .hint {
      position:fixed; z-index:20; top:14px; left:50%; transform:translateX(-50%);
      padding:9px 16px; border-radius:18px; color:#fff;
      background:rgba(0,0,0,.68); font-size:15px; text-align:center;
      pointer-events:none; white-space:nowrap;
    }
  </style>
</head>

<body>
<div class="hint">FCL4VET • Point the camera at the AR marker</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; colorManagement: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <a-asset-item id="ckzModel" src="assets/asset.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="assets/marker.patt">

    <!-- Main heading -->
    <a-plane position="0 1.42 -0.04" width="2.65" height="0.48"
             rotation="-90 0 0" color="#111111" opacity="0.88">
      <a-text value="FCL4VET - 3D PRINTING + AR"
              align="center" color="#FFFFFF" width="2.65"
              position="0 0.07 0.01"></a-text>
      <a-text value="DEVELOP"
              align="center" color="#4DA3FF" width="1.65"
              position="0 -0.13 0.012"></a-text>
    </a-plane>

    <!-- CKZ model -->
    <a-entity gltf-model="#ckzModel"
              position="0 0.16 0"
              rotation="-90 0 0"
              scale="1.05 1.05 1.05">
    </a-entity>

    <!-- Educational information cards -->
    <a-plane position="-0.94 0.80 -0.02" width="1.08" height="0.60"
             rotation="-90 0 0" color="#111111" opacity="0.88">
      <a-text value="From idea to 3D model"
              align="center" color="#4DA3FF" width="1.0"
              position="0 0.13 0.01"></a-text>
      <a-text value="Design and prepare a digital model for manufacturing."
              align="center" color="#FFFFFF" width="0.92"
              wrap-count="28" position="0 -0.06 0.01"></a-text>
    </a-plane>

    <a-plane position="0.94 0.80 -0.02" width="1.08" height="0.60"
             rotation="-90 0 0" color="#111111" opacity="0.88">
      <a-text value="Bambu Lab P2S"
              align="center" color="#4DA3FF" width="1.0"
              position="0 0.13 0.01"></a-text>
      <a-text value="Prepare print settings in Bambu Studio and manufacture the object."
              align="center" color="#FFFFFF" width="0.92"
              wrap-count="28" position="0 -0.06 0.01"></a-text>
    </a-plane>

    <a-plane position="-0.94 -0.55 -0.02" width="1.08" height="0.60"
             rotation="-90 0 0" color="#111111" opacity="0.88">
      <a-text value="Bringing objects to life"
              align="center" color="#4DA3FF" width="1.0"
              position="0 0.13 0.01"></a-text>
      <a-text value="Use AR to connect the physical 3D print with digital information."
              align="center" color="#FFFFFF" width="0.92"
              wrap-count="28" position="0 -0.06 0.01"></a-text>
    </a-plane>

    <a-plane position="0.94 -0.55 -0.02" width="1.08" height="0.60"
             rotation="-90 0 0" color="#111111" opacity="0.88">
      <a-text value="Learn - Use - Develop"
              align="center" color="#4DA3FF" width="1.0"
              position="0 0.13 0.01"></a-text>
      <a-text value="Explore the model, understand the process and develop new applications."
              align="center" color="#FFFFFF" width="0.92"
              wrap-count="28" position="0 -0.06 0.01"></a-text>
    </a-plane>

    <!-- Process -->
    <a-plane position="0 -1.18 -0.03" width="2.65" height="0.36"
             rotation="-90 0 0" color="#111111" opacity="0.90">
      <a-text value="3D MODEL  >  BAMBU STUDIO  >  3D PRINTING  >  AR"
              align="center" color="#FFFFFF" width="2.45"
              position="0 0 0.01"></a-text>
    </a-plane>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
