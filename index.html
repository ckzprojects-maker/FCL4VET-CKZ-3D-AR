<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family:Arial, sans-serif; }
    #hint {
      position:fixed; top:12px; left:50%; transform:translateX(-50%);
      z-index:10; background:rgba(0,0,0,.72); color:white;
      padding:9px 14px; border-radius:12px; text-align:center;
      font-size:14px; pointer-events:none;
    }
  </style>
</head>

<body>
<div id="hint">FCL4VET • skieruj kamerę na marker AR</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled:false;"
>
  <a-assets>
    <a-asset-item id="ckz-model" src="assets/asset.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="assets/marker.patt">

    <!-- Przykładowy element 3D -->
    <a-entity
      gltf-model="#ckz-model"
      position="0 0 0"
      rotation="0 0 0"
      scale="1.4 1.4 1.4">
    </a-entity>

    <!-- Nagłówek -->
    <a-plane position="0 1.05 0.02" width="2.45" height="0.34"
             material="color:#111; opacity:0.88; transparent:true">
    </a-plane>
    <a-text value="FCL4VET - DRUK 3D + AR"
            position="0 1.04 0.04"
            align="center" color="#FFFFFF"
            width="2.25">
    </a-text>

    <!-- Etykiety procesu -->
    <a-plane position="-1.15 0.55 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="MODEL 3D\nCyfrowy model elementu"
            position="-1.15 0.55 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <a-plane position="1.15 0.55 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="BAMBU STUDIO\nPrzygotowanie do druku"
            position="1.15 0.55 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <a-plane position="-1.15 -0.05 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="MATERIAL\nPLA"
            position="-1.15 -0.05 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <a-plane position="1.15 -0.05 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="TECHNOLOGIA\nFDM / FFF"
            position="1.15 -0.05 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <a-plane position="-1.15 -0.65 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="DRUK 3D\nBambu Lab P2S"
            position="-1.15 -0.65 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <a-plane position="1.15 -0.65 0.02" width="1.25" height="0.38"
             material="color:#FFFFFF; opacity:0.92; transparent:true">
    </a-plane>
    <a-text value="GOTOWY ELEMENT\nKontrola i wykorzystanie"
            position="1.15 -0.65 0.04"
            align="center" color="#111111"
            width="1.12">
    </a-text>

    <!-- Podpis -->
    <a-plane position="0 -1.15 0.02" width="2.7" height="0.32"
             material="color:#111; opacity:0.88; transparent:true">
    </a-plane>
    <a-text value="MODEL -> PRZYGOTOWANIE -> DRUK -> ELEMENT -> AR"
            position="0 -1.15 0.04"
            align="center" color="#FFFFFF"
            width="2.45">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
